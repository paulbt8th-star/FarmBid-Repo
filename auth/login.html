<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmBid · Sign in</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">

  <!-- Top Header -->
  <header class="auth-topbar">
    <a href="../index.html" class="brand-logo">
  <img src="../assets/images/logo.png" alt="FarmBid Logo">
</a>
  </header>

  <!-- Centered Login Card -->
  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-card-top">
        <div class="auth-icon-box" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22v-9"/><path d="M15.17 7.21a4 4 0 0 0-5.66 0L8 8.72l1.51 1.51a4 4 0 0 0 5.66 0l1.51-1.51-1.51-1.51z"/><path d="M9 14c-2.5 0-4.5-2-4.5-4.5V8h1.5C8.5 8 10.5 10 10.5 12.5V14H9z"/>
          </svg>
        </div>
      </div>

      <h1 class="auth-title">Welcome back!</h1>
      <p class="auth-subtitle">Sign in to your FarmBid account.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">E-mail address</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your e-mail address" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('password')" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-bright-green">
          <span>Sign in</span>
          <span>&rarr;</span>
        </button>
      </form>

      <!-- Social Sign-In (Google & Facebook Only) -->
      <div class="social-section">
        <div class="social-header">
          <span>Sign in with a social account</span>
          <span>One-click sign in</span>
        </div>
        <div class="social-buttons-grid">
          <button type="button" class="btn-social" title="Sign in with Google">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
              <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.9z"/>
              <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 20.9 7.4 24 12 24z"/>
            </svg>
          </button>
          <button type="button" class="btn-social" title="Sign in with Facebook">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="auth-bottom-Switch">
        New to FarmBid? <a href="register.html">Create an account</a>
      </div>
    </section>
  </main>

  <script>
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const response = await fetch('api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (response.ok && data.success) {
        localStorage.setItem('farmbid_user', JSON.stringify(data.user));

        const role = data.user.role;
        if (role === 'bidder') {
          window.location.href = '../bidder/dashboard.html';
        } else if (role === 'farmer') {
          window.location.href = '../farmer/dashboard.html';
        } else if (role === 'admin') {
          window.location.href = '../admin/dashboard.html';
        } else {
          window.location.href = '../bidder/dashboard.html';
        }
      } else {
        // Display the specific backend heads-up message (e.g. pending admin approval)
        alert(data.message || 'Login failed. Please check your credentials.');
      }
    } catch (error) {
      console.error('Error connecting to backend:', error);
      alert('Could not connect to the FarmBid server. Make sure your Python Flask backend is running on port 3000.');
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
      } else {
          passwordInput.type = 'password';
      }
    }
  });
</script>
</body>
</html>
