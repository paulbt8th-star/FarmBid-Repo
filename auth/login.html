<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmBid · Sign in</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">

  <!-- Top Header -->
  <header class="auth-topbar">
    <a href="../index.html" class="brand-logo">
      <img src="../assets/images/logo.png" alt="FarmBid Logo">
    </a>
  </header>

  <!-- Centered Login Card -->
  <main class="auth-main">
    <section class="auth-card">
      <div class="auth-card-top">
        <div class="auth-icon-box" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22v-9"/><path d="M15.17 7.21a4 4 0 0 0-5.66 0L8 8.72l1.51 1.51a4 4 0 0 0 5.66 0l1.51-1.51-1.51-1.51z"/><path d="M9 14c-2.5 0-4.5-2-4.5-4.5V8h1.5C8.5 8 10.5 10 10.5 12.5V14H9z"/>
          </svg>
        </div>
      </div>

      <h1 class="auth-title">Welcome back!</h1>
      <p class="auth-subtitle">Sign in to your FarmBid account.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">E-mail address</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your e-mail address" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('password')" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-bright-green">
          <span>Sign in</span>
          <span>&rarr;</span>
        </button>
      </form>

      <div class="auth-bottom-Switch">
        New to FarmBid? <a href="register.html">Create an account</a>
      </div>
    </section>
  </main>

  <script>
    const REMEMBERED_EMAIL_KEY = 'farmbid_remembered_email';

    function togglePassword(inputId = 'password') {
      const passwordInput = document.getElementById(inputId);
      if (!passwordInput) return;
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const emailInput = document.getElementById('email');
      const rememberCheckbox = document.getElementById('rememberMe');
      const savedEmail = localStorage.getItem(REMEMBERED_EMAIL_KEY);

      if (savedEmail && emailInput) {
        emailInput.value = savedEmail;
        if (rememberCheckbox) {
          rememberCheckbox.checked = true;
        }
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe')?.checked;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem('farmbid_user', JSON.stringify(data.user));

          if (rememberMe && email) {
            localStorage.setItem(REMEMBERED_EMAIL_KEY, email);
          } else {
            localStorage.removeItem(REMEMBERED_EMAIL_KEY);
          }

          const role = data.user.role;
          if (role === 'bidder') {
            window.location.href = '../bidder/dashboard.html';
          } else if (role === 'farmer') {
            window.location.href = '../farmer/dashboard.html';
          } else if (role === 'admin') {
            window.location.href = '../admin/dashboard.html';
          } else {
            window.location.href = '../bidder/dashboard.html';
          }
        } else {
          alert(data.message || 'Login failed. Please check your credentials.');
        }
      } catch (error) {
        console.error('Error connecting to backend:', error);
        alert('Could not connect to the FarmBid server.');
      }
    });
  </script>
</body>
</html>
