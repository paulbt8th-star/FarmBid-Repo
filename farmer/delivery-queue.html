<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmBid · Farmer Auctions & Delivery</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body class="dashboard-layout">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="dashboard.html" class="brand-logo">
        <img src="../assets/images/logo.png" alt="FarmBid Logo">
      </a>
    </div>

    <div class="workspace-label">Workspace</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="manage-listings.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>My Livestock</span>
      </a>
      <a href="delivery-queue.html" class="nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        <span>Auctions</span>
      </a>
      <a href="earnings.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>Earnings</span>
      </a>
      <a href="settings.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09A1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    
    <header class="dash-topbar">
      <div></div>
      <div class="dash-topbar-right" style="position: relative;">
        <span class="role-badge" style="background-color: var(--bg-soft-green); color: var(--brand-dark-green);">FARMER</span>
        
        <!-- Notifications Bell Button -->
        <div style="position: relative; display: inline-block;">
          <button id="notificationBtn" class="icon-btn" aria-label="Notifications" style="position: relative; cursor: pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="notifBadge" style="position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; display: none;"></span>
          </button>

          <!-- Notifications Dropdown Popup -->
          <div id="notificationDropdown" style="display: none; position: absolute; right: 0; top: 40px; width: 320px; background: #fff; border: 1px solid var(--border-light); border-radius: 8px; box-shadow: var(--shadow-card); z-index: 1000; padding: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-light); padding-bottom: 8px;">
              <span style="font-weight: 700; font-size: 0.9rem; color: #111;">Notifications</span>
            </div>
            <div id="notificationList" style="max-height: 250px; overflow-y: auto; font-size: 0.82rem; color: #444;">
              <div style="padding: 10px; text-align: center; color: #777; font-style: italic;">No new notifications</div>
            </div>
          </div>
        </div>

        <!-- User Profile Avatar Button -->
        <div style="position: relative; display: inline-block;">
          <button id="profileDropdownBtn" class="icon-btn" aria-label="Profile" style="cursor: pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>

          <!-- Profile Dropdown Menu -->
          <div id="profileDropdownMenu" style="display: none; position: absolute; right: 0; top: 40px; width: 240px; background: #fff; border: 1px solid var(--border-light); border-radius: 8px; box-shadow: var(--shadow-card); z-index: 1000; padding: 12px;">
            <div style="padding: 8px 10px; border-bottom: 1px solid var(--border-light); margin-bottom: 8px;">
              <div id="dropdownUserName" style="font-weight: 700; font-size: 0.88rem; color: #111;">Farmer User</div>
              <div id="dropdownUserEmail" style="font-size: 0.75rem; color: var(--text-muted); word-break: break-all;">farmer@gmail.com</div>
            </div>
            <a href="settings.html" style="display: block; padding: 8px 10px; font-size: 0.82rem; color: #333; text-decoration: none; border-radius: 4px;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='transparent'">Account Settings</a>
            <button id="logoutBtn" style="width: 100%; text-align: left; background: none; border: none; padding: 8px 10px; font-size: 0.82rem; color: #dc2626; font-weight: 600; cursor: pointer; border-radius: 4px;" onmouseover="this.style.background='#fee2e2'" onmouseout="this.style.background='transparent'">Log out</button>
          </div>
        </div>

      </div>
    </header>

    <div class="dash-container">
        
        <div class="page-header-row">
          <div>
            <h1 class="page-title">Auctions & Delivery Queue</h1>
            <p class="page-subtitle">Manage live auctions and dispatch queues directly from the database.</p>
          </div>
          <div class="date-pill">
            <span>Sep 26, 2026</span>
          </div>
        </div>

        <!-- Dynamic Database Content Container -->
        <div id="properAuctionsWrapper"></div>

    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    const user = JSON.parse(localStorage.getItem('farmbid_user') || localStorage.getItem('user') || localStorage.getItem('currentUser'));
    if (!user || user.role !== 'farmer') {
      window.location.href = '../auth/login.html';
      return;
    }

    if (user) {
      const nameEl = document.getElementById('dropdownUserName');
      const emailEl = document.getElementById('dropdownUserEmail');
      if (nameEl) nameEl.textContent = `${user.first_name || 'Farmer'} ${user.last_name || ''}`;
      if (emailEl) emailEl.textContent = user.email || '';
    }

    const farmerId = user.id || user.user_id || user.userId;

    // 1. Toggle Notification & Profile Dropdowns & Handle Red Dot Clearance
    const notifBtn = document.getElementById('notificationBtn');
    const notifDropdown = document.getElementById('notificationDropdown');
    const profileBtn = document.getElementById('profileDropdownBtn');
    const profileMenu = document.getElementById('profileDropdownMenu');
    const notifBadge = document.getElementById('notifBadge');
    const notifList = document.getElementById('notificationList');

    if (notifBtn && notifDropdown) {
      notifBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (profileMenu) profileMenu.style.display = 'none';
        
        const isOpen = notifDropdown.style.display === 'block';
        notifDropdown.style.display = isOpen ? 'none' : 'block';

        if (!isOpen && notifBadge) {
          notifBadge.style.display = 'none';
          localStorage.setItem('farmbid_farmer_notifications_read', 'true');
        }
      });

      notifDropdown.addEventListener('click', (e) => {
        e.stopPropagation();
      });
    }

    if (profileBtn && profileMenu) {
      profileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (notifDropdown) notifDropdown.style.display = 'none';
        profileMenu.style.display = profileMenu.style.display === 'block' ? 'none' : 'block';
      });

      profileMenu.addEventListener('click', (e) => {
        e.stopPropagation();
      });
    }

    document.addEventListener('click', () => {
      if (notifDropdown) notifDropdown.style.display = 'none';
      if (profileMenu) profileMenu.style.display = 'none';
    });

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        localStorage.clear();
        window.location.href = '../auth/login.html';
      });
    }

    // 2. Fetch Real-time Farmer Notifications & Deliveries
    try {
      const [resQueue, resNotif] = await Promise.all([
        fetch(`/api/farmer/delivery-queue/${farmerId}`),
        fetch(`/api/farmer/notifications/${farmerId}`)
      ]);

      const result = await resQueue.json();
      const notifResult = await resNotif.json();
      const isRead = localStorage.getItem('farmbid_farmer_notifications_read') === 'true';

      if (resNotif.ok && notifResult.success) {
        const notifs = notifResult.data || [];
        if (notifs.length > 0) {
          if (notifBadge && !isRead) notifBadge.style.display = 'block';
          if (notifList) {
            notifList.innerHTML = notifs.map(n => `
              <div style="padding: 10px 0; border-bottom: 1px solid #f3f4f6;">
                <div style="font-weight: 700; color: #111; font-size: 0.82rem;">${n.title}</div>
                <div style="color: #555; font-size: 0.78rem; margin-top: 2px;">${n.message}</div>
                <div style="color: #888; font-size: 0.7rem; margin-top: 2px;">${n.time}</div>
              </div>
            `).join('');
          }
        }
      }

      if (!resQueue.ok || !result.success) return;

      const listings = result.data || [];
      const pendingListings = listings.filter(l => l.auction_status !== 'completed');
      const completedListings = listings.filter(l => l.auction_status === 'completed');

      const wrapper = document.getElementById('properAuctionsWrapper');
      if (!wrapper) return;

      wrapper.innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px;">
          <div style="background: #fff; padding: 18px; border-radius: 12px; border: 1px solid #eaeaea;">
            <div style="font-size: 0.75rem; font-weight: 700; color: #666; text-transform: uppercase;">Ended Auctions</div>
            <div style="font-size: 1.8rem; font-weight: 800; color: #111; margin: 4px 0;">${pendingListings.length}</div>
            <div style="font-size: 0.78rem; color: #555;">Ready for payment verification</div>
          </div>
          <div style="background: #fff; padding: 18px; border-radius: 12px; border: 1px solid #eaeaea;">
            <div style="font-size: 0.75rem; font-weight: 700; color: #666; text-transform: uppercase;">Payment Verification</div>
            <div style="font-size: 1.8rem; font-weight: 800; color: #111; margin: 4px 0;">${pendingListings.length}</div>
            <div style="font-size: 0.78rem; color: #555;">Awaiting review</div>
          </div>
          <div style="background: #fff; padding: 18px; border-radius: 12px; border: 1px solid #eaeaea;">
            <div style="font-size: 0.75rem; font-weight: 700; color: #666; text-transform: uppercase;">Awaiting Delivery</div>
            <div style="font-size: 1.8rem; font-weight: 800; color: #111; margin: 4px 0;">0</div>
            <div style="font-size: 0.78rem; color: #555;">Ready for dispatch</div>
          </div>
          <div style="background: #fff; padding: 18px; border-radius: 12px; border: 1px solid #eaeaea;">
            <div style="font-size: 0.75rem; font-weight: 700; color: #666; text-transform: uppercase;">Completed Auctions</div>
            <div style="font-size: 1.8rem; font-weight: 800; color: #1e5631; margin: 4px 0;">${completedListings.length}</div>
            <div style="font-size: 0.78rem; color: #555;">Settled this month</div>
          </div>
        </div>

        <div style="background: #fff; border-radius: 12px; padding: 24px; border: 1px solid #eaeaea; margin-bottom: 24px;">
          <div style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h2 style="font-size: 1.05rem; font-weight: 700; color: #111; margin-bottom: 4px;">Buyer payments & verification</h2>
              <p style="font-size: 0.78rem; color: #666;">Payment status after an auction closes. Release livestock only after payment is verified.</p>
            </div>
          </div>

          ${pendingListings.length === 0 ? `
            <div style="padding: 30px; text-align: center; color: #666; font-size: 0.9rem; background: #fafafa; border-radius: 8px;">
              <p style="font-weight: 600; color: #333; margin-bottom: 4px;">No buyer payments or active verification records</p>
              <p style="color: #777; font-size: 0.82rem;">Pending payments and active delivery queues will appear here once auctions conclude.</p>
            </div>
          ` : `
            <div style="display: flex; flex-direction: column; gap: 12px;">
              ${pendingListings.map(item => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px; border: 1px solid #eaeaea; border-radius: 8px;">
                  <div>
                    <div style="font-weight: 700; font-size: 0.95rem; color: #111;">${item.animal_type} · ${Number(item.weight)} kg</div>
                    <div style="font-size: 0.78rem; color: #666; margin-top: 2px;">
                      AUC-${String(item.listing_id).padStart(3, '0')} &bull; Winner: <strong>${item.winner_first_name || 'Anonymous'} ${item.winner_last_name || ''}</strong> (${item.winner_contact || 'No Contact'})
                    </div>
                  </div>
                  <div style="text-align: right;">
                    <div style="font-weight: 800; color: #1e5631; font-size: 1rem;">₱${Number(item.winning_bid || item.current_highest_bid || item.starting_price).toLocaleString('en-PH')}</div>
                    <span style="font-size: 0.72rem; background: #fff3cd; color: #856404; padding: 2px 6px; border-radius: 4px; font-weight: 600;">Awaiting Payment Verification</span>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div style="background: #fff; border-radius: 12px; padding: 24px; border: 1px solid #eaeaea; margin-bottom: 24px;">
          <div style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h2 style="font-size: 1.05rem; font-weight: 700; color: #111; margin-bottom: 4px;">Completed auctions</h2>
              <p style="font-size: 0.78rem; color: #666;">Closed, settled, and delivered auction reports.</p>
            </div>
          </div>

          ${completedListings.length === 0 ? `
            <div style="padding: 30px; text-align: center; color: #666; font-size: 0.9rem; background: #fafafa; border-radius: 8px;">
              <p style="font-weight: 600; color: #333; margin-bottom: 4px;">No completed sales delivered yet</p>
              <p style="color: #777; font-size: 0.82rem;">Settled auction reports will be projected here.</p>
            </div>
          ` : `
            <div style="display: flex; flex-direction: column; gap: 12px;">
              ${completedListings.map(item => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px; border: 1px solid #eaeaea; border-radius: 8px; background: #fafdfa;">
                  <div>
                    <div style="font-weight: 700; font-size: 0.95rem; color: #1e5631;">${item.animal_type} · ${Number(item.weight)} kg (Delivered & Settled)</div>
                    <div style="font-size: 0.78rem; color: #666; margin-top: 2px;">
                      AUC-${String(item.listing_id).padStart(3, '0')} &bull; Buyer: <strong>${item.winner_first_name || 'Anonymous'} ${item.winner_last_name || ''}</strong>
                    </div>
                  </div>
                  <div style="text-align: right;">
                    <div style="font-weight: 800; color: #166534; font-size: 1rem;">₱${Number(item.winning_bid || item.current_highest_bid || item.starting_price).toLocaleString('en-PH')}</div>
                    <span style="font-size: 0.72rem; background: #dcfce7; color: #166534; padding: 2px 6px; border-radius: 4px; font-weight: 700;">Completed & Credited</span>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    } catch (err) {
      console.error('Error loading delivery queue:', err);
    }
  });
</script>

</body>
</html>
